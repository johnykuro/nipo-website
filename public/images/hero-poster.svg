<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Dark green botanical texture with warm firelight">
  <defs>
    <radialGradient id="fire" cx="74%" cy="59%" r="52%">
      <stop offset="0" stop-color="#b96f2e" stop-opacity=".56"/>
      <stop offset=".25" stop-color="#64412a" stop-opacity=".32"/>
      <stop offset=".7" stop-color="#15231f" stop-opacity=".08"/>

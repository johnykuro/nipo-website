[build]
  command = "pnpm test && pnpm build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.13.1"

[[redirects]]
  from = "https://www.nipobraza.co.uk/*"
  to = "https://nipobraza.co.uk/:splat"
  status = 301
  force = true
